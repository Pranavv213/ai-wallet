<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Web3 Persistent Vault & Transfer Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --bot-msg: #334155;
      --user-msg: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .container {
      width: 100%; max-width: 720px; background-color: var(--card-bg);
      border: 1px solid var(--border); border-radius: 12px; padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; height: 90vh;
    }

    .header { text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .header h1 { font-size: 1.3rem; color: var(--accent); }
    .header p { font-size: 0.85rem; color: var(--text-muted); }

    .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 6px; margin-bottom: 16px; }
    
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 8px; font-size: 0.92rem; line-height: 1.4; }
    .msg.user { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
    .msg.bot { align-self: flex-start; background-color: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; }

    .action-card { margin-top: 10px; padding: 14px; background-color: #0f172a; border: 1px solid var(--accent); border-radius: 8px; font-size: 0.85rem; word-break: break-all; }
    .action-card-title { color: var(--accent); font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .form-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .form-control { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.85rem; outline: none; }
    .form-control:focus { border-color: var(--accent); }

    .account-row { background: #1e293b; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 8px; }
    .account-row.active { border-color: var(--success); }

    .balance-badge { color: var(--accent); font-weight: bold; font-size: 0.85rem; }

    .key-field-container { display: flex; align-items: center; gap: 6px; margin-top: 4px; background: #0f172a; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border); }
    .key-text { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .icon-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
    .icon-btn:hover { background: var(--border); }

    .card-btn { width: 100%; padding: 9px; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; margin-top: 10px; }
    .card-btn:hover { background: var(--accent-hover); }
    .card-btn.secondary { background: transparent; border: 1px solid var(--border); color: #fff; margin-top: 6px; }

    .result-box { margin-top: 10px; padding: 8px 10px; background: #1e293b; border-radius: 6px; border-left: 3px solid var(--success); font-family: monospace; font-size: 0.8rem; }

    .input-box { display: flex; gap: 10px; }
    .input-box input { flex: 1; padding: 12px; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
    .input-box input:focus { border-color: var(--accent); }
    .input-box button { padding: 12px 20px; background-color: var(--accent); border: none; border-radius: 8px; font-weight: 600; color: #000; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Gemini Web3 Transfer & Vault Agent</h1>
      <p>Send Sepolia ETH or ERC-20 Tokens using Vault Accounts</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot" id="welcomeMsg">
        Welcome! Ask me to create accounts, check balances, add funds, or transfer tokens.<br/><br/>
        Try asking:<br/>
        • "Add funds to account 3"<br/>
        • "Show balance of account 2"<br/>
        • "Send 0.001 ETH from account 1 to 0x..."
      </div>
    </div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="Type your request..." />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const MASTER_PRIVATE_KEY = "0x8995f4b872b7ae383f39d9762d69cac51aa6c2fb1cca761b6228e45d9fff0d4f";
    const FASTAPI_URL = "http://127.0.0.1:8000/api/chat";
    const VAULT_STORAGE_KEY = "web3_persistent_vault_accounts";
    const ACTIVE_ACC_KEY = "web3_persistent_vault_active_index";
    const SESSION_ID = "session_" + Math.random().toString(36).substring(2, 9);
    const MASK_TEXT = "••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••";
    
    const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";
    const provider = new ethers.JsonRpcProvider(RPC_URL);

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    let accounts = [];
    let activeAccountIndex = -1;

    window.addEventListener("DOMContentLoaded", () => {
      loadVaultFromStorage();
    });

    function loadVaultFromStorage() {
      const stored = localStorage.getItem(VAULT_STORAGE_KEY);
      if (stored) {
        try {
          accounts = JSON.parse(stored);
          const storedActive = localStorage.getItem(ACTIVE_ACC_KEY);
          activeAccountIndex = storedActive !== null ? parseInt(storedActive, 10) : (accounts.length ? 0 : -1);
        } catch (e) {
          accounts = [];
          activeAccountIndex = -1;
        }
      }
    }

    function saveVaultToStorage() {
      localStorage.setItem(VAULT_STORAGE_KEY, JSON.stringify(accounts));
      localStorage.setItem(ACTIVE_ACC_KEY, activeAccountIndex.toString());
    }

    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";

      try {
        const response = await fetch(FASTAPI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: SESSION_ID,
            user_message: text,
            accounts: accounts.map(a => ({ name: a.name, address: a.address })),
            active_account_index: activeAccountIndex
          }),
        });

        const data = await response.json();
        const botMsgDiv = appendMessage("bot", data.message);

        if (data.action === "add_funds") {
          renderAddFundsCard(data.target_address, botMsgDiv);
        } else if (data.action === "check_balance") {
          await handleCheckBalance(data.target_address, botMsgDiv);
        } else if (data.action === "send_tokens") {
          await handleSendTokensIntent(data, botMsgDiv);
        } else if (data.action === "list_accounts") {
          await renderAccountsList(botMsgDiv);
        } else if (data.action === "create_account") {
          await handleCreateAccount(botMsgDiv);
        }

      } catch (err) {
        appendMessage("bot", "Error connecting to backend server.");
      }
    }

    function renderAddFundsCard(targetAddress, targetElement) {
      if (!targetAddress) {
        // Render selector if LLM prompt asks the user to pick an account
        if (accounts.length === 0) return;
        
        const cardId = "fund-card-" + Date.now();
        let options = accounts.map((a, i) => `<option value="${a.address}">${a.name} (${a.address.substring(0,6)}...)</option>`).join('');

        targetElement.innerHTML += `
          <div class="action-card" id="${cardId}">
            <div class="action-card-title">💰 Select Account to Add Funds</div>
            <div class="form-group">
              <label>Target Account:</label>
              <select id="${cardId}-select" class="form-control">
                ${options}
              </select>
            </div>
            <button class="card-btn" onclick="executeAddFundsFromMaster(document.getElementById('${cardId}-select').value, '${cardId}-status')">
              Transfer 0.009 Sepolia ETH from Master Key
            </button>
            <div id="${cardId}-status"></div>
          </div>
        `;
        return;
      }

      const targetAcc = accounts.find(a => a.address.toLowerCase() === targetAddress.toLowerCase());
      const labelName = targetAcc ? targetAcc.name : targetAddress;
      const statusId = "fund-status-" + Date.now();

      targetElement.innerHTML += `
        <div class="action-card">
          <div class="action-card-title">📥 Add Funds to ${labelName}</div>
          <p>Target Address: <code>${targetAddress}</code></p>
          <button class="card-btn" onclick="executeAddFundsFromMaster('${targetAddress}', '${statusId}')">
            Transfer 0.009 Sepolia ETH from Master Key
          </button>
          <div id="${statusId}"></div>
        </div>
      `;
    }

    async function executeAddFundsFromMaster(recipientAddress, statusElementId) {
      const statusDiv = document.getElementById(statusElementId);
      statusDiv.innerHTML = `<div class="result-box">Sending 0.009 Sepolia ETH from Master Vault...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const masterWallet = new ethers.Wallet(MASTER_PRIVATE_KEY, provider);
        const tx = await masterWallet.sendTransaction({
          to: recipientAddress,
          value: ethers.parseEther("0.009")
        });

        statusDiv.innerHTML = `
          <div class="result-box">
            ✔ <strong>Funding Tx Broadcasted!</strong><br/>
            <strong>Tx Hash:</strong> <a href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank" style="color:var(--accent);">${tx.hash.substring(0, 18)}...</a>
          </div>
        `;

        await tx.wait(1);
        statusDiv.innerHTML += `<div style="color:var(--success); font-family:monospace; margin-top:4px;">✔ 0.009 ETH Deposited!</div>`;
      } catch (err) {
        statusDiv.innerHTML = `<div class="result-box" style="border-left-color:var(--danger); color:var(--danger);">Funding Failed: ${err.message}</div>`;
      }
    }

    async function handleCheckBalance(targetAddress, targetElement) {
      const addr = targetAddress || (accounts[activeAccountIndex] ? accounts[activeAccountIndex].address : null);
      if (!addr) {
        targetElement.innerHTML += `<br/><div class="result-box" style="border-left-color:var(--danger);">No target account specified or active.</div>`;
        return;
      }

      try {
        const bal = await provider.getBalance(addr);
        const formatted = ethers.formatEther(bal);
        targetElement.innerHTML += `
          <div class="action-card">
            <div class="action-card-title">💰 Balance Information</div>
            <strong>Address:</strong> ${addr}<br/>
            <strong>Balance:</strong> <span class="balance-badge">${formatted} Sepolia ETH</span>
          </div>
        `;
      } catch (e) {
        targetElement.innerHTML += `<br/><div class="result-box" style="border-left-color:var(--danger);">Failed to query balance.</div>`;
      }
    }

    async function handleSendTokensIntent(data, targetElement) {
      const senderAcc = accounts.find(a => a.address.toLowerCase() === (data.target_address || "").toLowerCase()) || accounts[activeAccountIndex];
      
      if (!senderAcc) {
        targetElement.innerHTML += `<div class="result-box" style="border-left-color:var(--danger);">Sender account not found in vault.</div>`;
        return;
      }

      const balance = await provider.getBalance(senderAcc.address);
      const balanceEth = parseFloat(ethers.formatEther(balance));
      const requiredAmount = data.amount || 0;

      if (balanceEth < requiredAmount) {
        targetElement.innerHTML += `
          <div class="result-box" style="border-left-color:var(--danger); color:var(--danger);">
            ❌ <strong>Insufficient Balance!</strong><br/>
            Required: ${requiredAmount} ETH | Available: ${balanceEth} ETH on ${senderAcc.name}.
          </div>
        `;
        return;
      }

      renderSendForm(targetElement, senderAcc.address, data.recipient_address, data.amount, data.asset_type);
    }

    function renderSendForm(targetElement, senderAddr = '', recipientAddr = '', amount = '', assetType = 'ETH') {
      const formId = "send-form-" + Date.now();
      let accountOptionsHtml = accounts.map((acc, idx) => 
        `<option value="${idx}" ${acc.address.toLowerCase() === senderAddr.toLowerCase() ? 'selected' : ''}>${acc.name} (${acc.address.substring(0,6)}...)</option>`
      ).join('');

      targetElement.innerHTML += `
        <div class="action-card" id="${formId}">
          <div class="action-card-title">📤 Confirm & Sign Transaction</div>
          
          <div class="form-group">
            <label>Sender Account:</label>
            <select id="${formId}-sender" class="form-control">
              ${accountOptionsHtml}
            </select>
          </div>

          <div class="form-group">
            <label>Recipient Address:</label>
            <input type="text" id="${formId}-recipient" class="form-control" value="${recipientAddr || ''}" placeholder="0x..." />
          </div>

          <div class="form-group">
            <label>Amount:</label>
            <input type="number" step="any" id="${formId}-amount" class="form-control" value="${amount || ''}" placeholder="0.01" />
          </div>

          <button class="card-btn" onclick="executeSendTransaction('${formId}')">Confirm & Sign Transaction</button>
          <div id="${formId}-status"></div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function executeSendTransaction(formId) {
      const senderIdx = parseInt(document.getElementById(`${formId}-sender`).value, 10);
      const recipient = document.getElementById(`${formId}-recipient`).value.trim();
      const amountStr = document.getElementById(`${formId}-amount`).value.trim();
      const statusDiv = document.getElementById(`${formId}-status`);

      if (!ethers.isAddress(recipient)) {
        statusDiv.innerHTML = `<div class="result-box" style="border-left-color:var(--danger); color:var(--danger);">Invalid Recipient Address</div>`;
        return;
      }

      const senderAccount = accounts[senderIdx];
      const wallet = new ethers.Wallet(senderAccount.privateKey, provider);

      statusDiv.innerHTML = `<div class="result-box">Signing transaction...</div>`;

      try {
        const tx = await wallet.sendTransaction({
          to: recipient,
          value: ethers.parseEther(amountStr)
        });

        statusDiv.innerHTML = `
          <div class="result-box">
            ✔ <strong>Transaction Broadcasted!</strong><br/>
            <strong>Tx Hash:</strong> <a href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank" style="color:var(--accent);">${tx.hash.substring(0, 18)}...</a>
          </div>
        `;

        await tx.wait(1);
        statusDiv.innerHTML += `<div style="color:var(--success); font-family:monospace; margin-top:4px;">✔ Confirmed on Sepolia Blockchain!</div>`;
      } catch (err) {
        statusDiv.innerHTML = `<div class="result-box" style="border-left-color:var(--danger); color:var(--danger);">Failed: ${err.message}</div>`;
      }
    }

    async function handleCreateAccount(targetElement) {
      const accIdx = accounts.length;
      const wallet = ethers.Wallet.createRandom();

      const newAccount = {
        name: `Account ${accIdx + 1}`,
        address: wallet.address,
        privateKey: wallet.privateKey,
      };

      accounts.push(newAccount);
      activeAccountIndex = accounts.length - 1;
      saveVaultToStorage();

      const keyRowHtml = createPrivateKeyRowHtml(newAccount.privateKey, `create-${Date.now()}`);

      targetElement.innerHTML += `
        <div class="action-card">
          <div class="action-card-title">✔ ${newAccount.name} Created</div>
          <div class="account-row active">
            <strong>Address:</strong> ${newAccount.address}<br/>
            <strong>Balance:</strong> <span class="balance-badge">0.0 Sepolia ETH</span><br/>
            <strong>Private Key:</strong> ${keyRowHtml}
          </div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function renderAccountsList(targetElement) {
      if (accounts.length === 0) {
        targetElement.innerHTML += `<div class="action-card"><div class="action-card-title">📂 Vault is Empty</div></div>`;
        return;
      }

      const listCardId = "vault-list-" + Date.now();
      let listHtml = `<div class="action-card" id="${listCardId}"><div class="action-card-title">📂 Vault Accounts (${accounts.length})</div>`;

      accounts.forEach((acc, idx) => {
        const isActive = idx === activeAccountIndex;
        const keyRowHtml = createPrivateKeyRowHtml(acc.privateKey, `list-${idx}-${Date.now()}`);

        listHtml += `
          <div class="account-row ${isActive ? 'active' : ''}">
            <strong>${acc.name}</strong> ${isActive ? '<span style="color:var(--success); font-size:0.75rem;">(ACTIVE)</span>' : ''}<br/>
            <span style="color:var(--text-muted); font-size:0.75rem;">Address: ${acc.address}</span><br/>
            <strong>Balance:</strong> <span class="balance-badge" id="bal-${listCardId}-${idx}">Fetching...</span><br/>
            <strong>Private Key:</strong> ${keyRowHtml}
          </div>
        `;
      });

      listHtml += `</div>`;
      targetElement.innerHTML += listHtml;
      chatBox.scrollTop = chatBox.scrollHeight;

      accounts.forEach(async (acc, idx) => {
        const balEl = document.getElementById(`bal-${listCardId}-${idx}`);
        if (balEl) {
          try {
            const rawBalance = await provider.getBalance(acc.address);
            balEl.textContent = `${ethers.formatEther(rawBalance)} Sepolia ETH`;
          } catch (e) {
            balEl.textContent = "Error loading";
          }
        }
      });
    }

    function createPrivateKeyRowHtml(privateKey, idPrefix) {
      const textId = `pk-text-${idPrefix}`;
      const toggleBtnId = `pk-toggle-${idPrefix}`;
      const copyBtnId = `pk-copy-${idPrefix}`;

      return `
        <div class="key-field-container">
          <span id="${textId}" class="key-text" data-raw="${privateKey}">${MASK_TEXT}</span>
          <button id="${toggleBtnId}" class="icon-btn" onclick="toggleKeyVisibility('${textId}', '${toggleBtnId}')">Show</button>
          <button id="${copyBtnId}" class="icon-btn" onclick="copyToClipboard('${privateKey}', '${copyBtnId}')">Copy</button>
        </div>
      `;
    }

    function toggleKeyVisibility(textId, toggleBtnId) {
      const textEl = document.getElementById(textId);
      const btnEl = document.getElementById(toggleBtnId);
      const rawKey = textEl.getAttribute("data-raw");

      if (textEl.textContent === MASK_TEXT) {
        textEl.textContent = rawKey;
        btnEl.textContent = "Hide";
      } else {
        textEl.textContent = MASK_TEXT;
        btnEl.textContent = "Show";
      }
    }

    function copyToClipboard(text, btnId) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById(btnId);
        const originalText = btn.textContent;
        btn.textContent = "Copied!";
        btn.style.color = "var(--success)";
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.color = "var(--accent)";
        }, 1500);
      });
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
